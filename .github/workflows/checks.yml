name: Prototype checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - name: Smoke test HTTP route
        run: |
          node src/server.js &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          sleep 2
          curl --fail --silent http://127.0.0.1:3000/api/health
